<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ESCUDO 360 – Prototipo interactivo</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#102B4E;--blue:#1268B2;--sky:#44BCE6;--pale:#EAF6FF;--green:#1D856A;--amber:#D98420;--red:#B9303D;--bg:#dfe9f3;--ink:#102B4E;--card:#fff;--line:#c9dcec}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1726}}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);font-family:"Atkinson Hyperlegible",Inter,system-ui,sans-serif;overflow:hidden;color:var(--ink)}
.phone{position:absolute;left:50%;top:50%;width:410px;height:864px;transform:translate(-50%,-50%);background:#0c1b2e;border-radius:52px;padding:10px;box-shadow:0 30px 70px rgba(16,43,78,.35)}
.app{--k:1;position:relative;width:100%;height:100%;background:#fff;border-radius:38px;overflow:hidden;display:flex;flex-direction:column;font-size:calc(18px*var(--k));line-height:1.45}
.app.hc{--navy:#000d24;--blue:#0a4f8f;--line:#000d24;--pale:#fff}
.app.hc .card{border:2px solid #000d24}
.badge{align-self:center;margin-top:10px;font-size:.62em;background:var(--pale);color:var(--navy);border:1px solid var(--line);padding:2px 10px;border-radius:99px;font-weight:700}
#scr{flex:1;overflow-y:auto;padding:14px 20px 20px;animation:in .3s ease}
@keyframes in{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
h1{font-size:1.45em;line-height:1.2;color:var(--navy);font-weight:700;margin:8px 0}
h2{font-size:1.15em;color:var(--navy);font-weight:700}
p{margin:6px 0;color:#25405f}.s{font-size:.9em}.c{text-align:center}
.app.hc p{color:#000}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0;box-shadow:0 3px 12px rgba(16,43,78,.08)}
.card.p{background:var(--pale)}
.btn{display:block;width:100%;min-height:56px;border:0;border-radius:14px;background:var(--blue);color:#fff;font:700 1em inherit;font-family:inherit;padding:10px 14px;margin:10px 0;cursor:pointer;line-height:1.2}
.btn:hover{filter:brightness(1.1)}.btn:focus-visible,.nav button:focus-visible,.card:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.btn.g{background:var(--green)}.btn.o{background:#fff;color:var(--blue);border:2px solid var(--blue)}.btn.a{background:var(--amber);color:#1b1000}
.btn.sm{min-height:44px;width:auto;display:inline-block;padding:8px 16px;margin:6px 0}
.back{background:none;border:0;color:var(--blue);font:700 .9em inherit;font-family:inherit;cursor:pointer;padding:6px 0;min-height:40px}
.price{font-size:1.75em;font-weight:700;color:var(--navy)}
.tag{display:inline-block;background:var(--sky);color:#06243d;font-weight:700;font-size:.72em;padding:3px 10px;border-radius:99px}
ul.ck{list-style:none;padding:0}ul.ck li{padding:3px 0 3px 26px;position:relative;font-size:.88em}
ul.ck li:before{content:"✓";position:absolute;left:0;color:var(--green);font-weight:700}
.plan{cursor:pointer;border:2px solid var(--blue);transition:.2s}.plan.sel{box-shadow:0 0 0 4px var(--sky);transform:scale(1.01)}
.row{display:flex;gap:12px;align-items:center}.ic{font-size:1.8em}
.av{width:64px;height:64px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-weight:700;font-size:1.3em;background:linear-gradient(135deg,var(--blue),var(--sky));border:3px solid #fff;box-shadow:0 0 0 2px var(--sky)}
.nav{display:flex;border-top:1px solid var(--line);background:#fff;padding-bottom:6px}
.nav button{flex:1;border:0;background:none;padding:8px 2px;font:700 .62em inherit;font-family:inherit;color:#456;cursor:pointer;min-height:56px}
.nav button.on{color:var(--blue)}.nav span{display:block;font-size:1.7em}
.wa{background:#e9e4da;border-radius:16px;padding:10px;margin:10px 0}
.wah{background:#075e54;color:#fff;border-radius:12px;padding:8px 12px;font-size:.85em;margin-bottom:8px}
.bub{background:#fff;border-radius:4px 14px 14px 14px;padding:10px 12px;font-size:.88em;color:#111;box-shadow:0 1px 2px #0003}
.bub.me{background:#d9fdd3;border-radius:14px 4px 14px 14px;margin-left:30px}
.prog{height:10px;background:var(--pale);border-radius:9px;overflow:hidden;margin:16px 0;border:1px solid var(--line)}
.prog i{display:block;height:100%;width:0;background:var(--blue);transition:width 1.6s linear}
.warn{background:var(--pale);border:2px solid var(--amber);border-radius:18px;padding:14px;text-align:center}
.sig{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-left:5px solid var(--amber);border-radius:12px;padding:10px;margin:8px 0}
.sig b{color:var(--navy)}.sig p{margin:0;font-size:.82em}
.ok{background:#e7f6f1;border:2px solid var(--green);border-radius:16px;padding:14px;margin:12px 0}
.sw{display:flex;justify-content:space-between;gap:10px;align-items:center}
.tg{flex:none;width:58px;height:34px;border-radius:99px;border:0;background:#9db0c4;position:relative;cursor:pointer}
.tg:after{content:"";position:absolute;top:4px;left:4px;width:26px;height:26px;border-radius:50%;background:#fff;transition:.2s}
.tg.on{background:var(--green)}.tg.on:after{left:28px}
input{width:100%;font:700 1.4em inherit;font-family:inherit;letter-spacing:.3em;text-align:center;padding:12px;border:2px solid var(--blue);border-radius:12px;color:var(--navy)}
.pulse{animation:pl 1s infinite alternate}@keyframes pl{to{transform:scale(1.12)}}
.toast{position:absolute;left:20px;right:20px;bottom:80px;background:var(--navy);color:#fff;border-radius:12px;padding:12px;font-size:.8em;text-align:center;animation:in .3s}
#scr h1{font-size:1.6em;margin:10px 0 6px}#scr .card{margin:14px 0;padding:16px}.stp{margin:2px 0 10px}.bar{height:7px;background:var(--pale);border-radius:9px;overflow:hidden;border:1px solid var(--line);margin-top:4px}.bar i{display:block;height:100%;background:var(--blue);transition:width .4s}.trial{background:#e7f6f1;border:1px solid var(--green);border-radius:12px;padding:10px 12px;margin:10px 0;font-size:.9em;color:#0d4a3a}.rw{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:.92em}.rw:last-child{border:0}.opt{display:flex;gap:12px;align-items:center;cursor:pointer;border:2px solid var(--line)}.opt.sel{border-color:var(--blue);background:var(--pale)}.opt .rd{width:26px;height:26px;border-radius:50%;border:2px solid var(--blue);margin-left:auto;flex:none;display:grid;place-items:center;background:#fff}.opt.sel .rd:after{content:"";width:12px;height:12px;border-radius:50%;background:var(--blue)}.big{width:56px;height:56px;border-radius:16px;background:var(--pale);display:grid;place-items:center;font-size:1.7em;flex:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:430px) and (pointer:coarse){.phone{position:static;transform:none!important;width:100%;height:100vh;height:100dvh;border-radius:0;padding:0}.app{border-radius:0}}
</style>
</head>
<body>
<div class="phone"><div class="app" id="app"><div class="badge">Prototipo demostrativo · datos simulados</div><div id="scr"></div><div id="nv"></div></div></div>
<script>
var S={prof:'self',plan:null,sel:null,code:'482915',linked:null,perm:{a:true,s:true,n:true},k:1,hc:false,hist:[],cur:'welcome',fromHome:false,sent:false};
var $=function(i){return document.getElementById(i)};
var LOGO=function(w){return '<svg width="'+w+'" viewBox="0 0 100 100" aria-hidden="true"><ellipse cx="50" cy="56" rx="46" ry="14" fill="none" stroke="#44BCE6" stroke-width="4" transform="rotate(-18 50 56)"/><path d="M50 8 82 20v26c0 22-14 38-32 46C32 84 18 68 18 46V20z" fill="#1268B2"/><path d="M50 8v84C32 84 18 68 18 46V20z" fill="#0f5da0"/><rect x="38" y="42" width="24" height="20" rx="4" fill="#fff"/><path d="M42 42v-6a8 8 0 0 1 16 0v6" fill="none" stroke="#fff" stroke-width="4"/><circle cx="50" cy="51" r="3" fill="#1268B2"/></svg>'};
var BRAND=function(w){return '<div class="c">'+LOGO(w)+'<div style="font-weight:700;color:#102B4E;font-size:1.7em;line-height:1">ESCUDO <span style="color:#1268B2">360</span></div><div class="s" style="color:#25405f;margin-top:4px"><i>Tecnología que alerta. Familia que protege.</i></div></div>'};
var MINI='<div class="row" style="gap:6px">';
var price=function(){return S.plan=='ind'?'$15.900':'$31.900'};
var pname=function(){return S.plan=='ind'?'Plan Individual':'Plan Familiar'};
var IND=['Protección para 1 adulto mayor','Hasta 2 familiares o contactos de confianza','Detección de señales de posibles estafas con IA','Alertas preventivas','Función Pausa Segura','Verificación Familiar Inteligente','Análisis de mensajes y enlaces sospechosos','Verificación de códigos QR','Notificaciones de seguridad','Interfaz accesible','Soporte técnico','Prueba gratuita de 14 días'];
var FAM=['Protección para hasta 2 adultos mayores','Hasta 4 familiares o contactos de confianza'].concat(IND.slice(2,11),['<b>Protección Activa:</b> VPN y filtrado de sitios potencialmente fraudulentos','Prueba gratuita de 14 días']);
var li=function(a){return '<ul class="ck">'+a.map(function(x){return '<li>'+x+'</li>'}).join('')+'</ul>'};
var back=function(){return S.hist.length?'<button class="back" onclick="bk()">← Volver</button>':''};
function go(id,rep){if(!rep)S.hist.push(S.cur);S.cur=id;draw()}
function bk(){S.cur=S.hist.pop()||'welcome';draw()}
function home(){S.hist=[];S.cur='home';draw()}
function toast(t){var d=document.createElement('div');d.className='toast';d.textContent=t;$('app').appendChild(d);setTimeout(function(){d.remove()},2600)}
function choose(p){S.plan=p;if(S.fromHome){S.fromHome=false;toast('Plan actualizado en la demostración');S.hist=[];S.cur='home';draw()}else go('confirm')}
function setProf(p){S.prof=p;go('plans')}
function gen(){S.code=String(100000+Math.floor(Math.random()*899999));S.gen=true;draw()}
function install(){var b=$('ib');b.disabled=true;b.textContent='Instalando…';$('pb').style.width='100%';setTimeout(function(){$('st').innerHTML='<b style="color:#1D856A">✓ Instalación completada</b>';b.outerHTML='<button class="btn g" onclick="go(\'link\')">ABRIR ESCUDO 360</button>'},1700)}
function tryLink(){var v=$('cd').value.replace(/\D/g,'');if(v.length!=6){toast('El código tiene 6 números');return}S.code=v;S.found=true;draw()}
function tg(k){S.perm[k]=!S.perm[k];draw()}
function fs(d){S.k=Math.min(1.35,Math.max(.85,S.k+d));draw()}
function analyze(){go('scan');setTimeout(function(){if(S.cur=='scan')go('alert',true)},1800);setTimeout(function(){var p=$('pp');if(p)p.style.width='100%'},60)}
function consult(){S.sent=true;draw();setTimeout(function(){if(S.cur=='verify')go('reply',true)},1800)}
function reset(){var k=S.k,h=S.hc;S={prof:'self',plan:null,sel:null,code:'482915',linked:null,perm:{a:true,s:true,n:true},k:k,hc:h,hist:[],cur:'welcome',fromHome:false,sent:false};draw()}
function sel(p){S.sel=p;draw()}
var NAVS=['home','analyze','family','settings'];
function nav(){var t=[['home','🏠','Inicio'],['analyze','🔍','Analizar'],['family','👪','Familia'],['settings','⚙️','Configuración']];return '<nav class="nav">'+t.map(function(x){return '<button class="'+(S.cur==x[0]?'on':'')+'" onclick="S.hist=[];S.cur=\''+x[0]+'\';draw()"><span>'+x[1]+'</span>'+x[2]+'</button>'}).join('')+'</nav>'}
var SC={
welcome:function(){return '<div style="height:20px"></div>'+BRAND(120)+'<h1 class="c" style="margin-top:28px">Tu seguridad digital, acompañada.</h1><p class="c">Te ayudamos a reconocer posibles estafas digitales y actuar con mayor tranquilidad.</p><button class="btn" onclick="setProf(\'self\')">QUIERO PROTEGERME</button><button class="btn o" onclick="setProf(\'family\')">QUIERO PROTEGER A UN FAMILIAR</button><p class="c s">Este es un prototipo académico. No se realiza ningún pago ni se accede a datos reales.</p>'},
plans:function(){return back()+'<h1>Elegí tu plan de protección</h1><p>Encontrá la opción que mejor se adapte a '+(S.prof=='self'?'vos y a tu familia.':'tu familiar y a vos.')+'</p>'+
'<div class="card plan '+(S.sel=='ind'?'sel':'')+'" tabindex="0" onclick="sel(\'ind\')"><div class="row"><span class="ic">🛡️👤</span><h2>PLAN INDIVIDUAL</h2></div><div class="price">$15.900 <span class="s">/ mes</span></div><p class="s"><i>IVA incluido.</i></p>'+li(IND)+'<button class="btn" onclick="event.stopPropagation();choose(\'ind\')">ELEGIR PLAN INDIVIDUAL</button></div>'+
'<div class="card p plan '+(S.sel=='fam'?'sel':'')+'" tabindex="0" onclick="sel(\'fam\')"><span class="tag">PROTECCIÓN AMPLIADA</span><div class="row"><span class="ic">🛡️👥</span><h2>PLAN FAMILIAR</h2></div><div class="price">$31.900 <span class="s">/ mes</span></div><p class="s"><i>IVA incluido.</i></p>'+li(FAM)+'<button class="btn" onclick="event.stopPropagation();choose(\'fam\')">ELEGIR PLAN FAMILIAR</button></div>'},
confirm:function(){return back()+'<div class="card p c"><div style="font-size:3em">🛡️✅</div><h1>¡Excelente elección!</h1><p>Elegiste el '+pname()+' de ESCUDO 360.</p><div class="price">'+price()+' <span class="s">/ mes</span></div><p class="s">IVA incluido</p></div><div class="ok c"><h2>Probalo gratis durante 14 días.</h2><p class="s">Conocé cómo funciona ESCUDO 360 antes de decidir si querés contratarlo.</p></div><button class="btn" onclick="go(\''+(S.prof=='family'?'invite':'store')+'\')">COMENZAR CONFIGURACIÓN</button><button class="btn o" onclick="bk()">CAMBIAR DE PLAN</button><p class="c s">Contratación y prueba gratuita simuladas. No se pide tarjeta.</p>'},
invite:function(){return back()+'<h1>Protegé a alguien que querés</h1><p>Invitá a un familiar a utilizar ESCUDO 360 y acompañalo cuando necesite verificar una situación sospechosa.</p><div class="card p"><p class="s">Persona que quiero proteger</p><div class="row"><div class="av">MF</div><div><h2>Marta Fernández</h2><p style="margin:0">69 años</p></div></div></div>'+(S.gen?'<div class="ok c"><p class="s">Código de invitación</p><div class="price" style="letter-spacing:.2em">'+S.code+'</div><p class="s">Compartí este código con Marta para que pueda vincular su aplicación.</p></div><button class="btn" onclick="go(\'store\')">CONTINUAR</button>':'<button class="btn" onclick="gen()">GENERAR INVITACIÓN</button>')+'<button class="back" onclick="go(\'store\')">Omitir y continuar a la instalación</button>'},
store:function(){return back()+'<p class="c s"><b>Tienda de aplicaciones</b> (simulada)</p><div class="card"><div class="row">'+LOGO(60)+'<div><h2>ESCUDO 360</h2><p class="s" style="margin:0">Seguridad digital y acompañamiento familiar.</p></div></div><div id="st" class="s" style="margin-top:10px">Listo para instalar</div><div class="prog"><i id="pb"></i></div><button class="btn" id="ib" onclick="install()">INSTALAR ESCUDO 360</button></div><p class="c s">Representación visual. No se descarga ningún software real.</p>'},
link:function(){if(S.found)return '<h1>Conectate con alguien de confianza</h1><div class="card p c"><div class="av" style="margin:0 auto 8px;width:84px;height:84px">CL</div><h2>Carolina López quiere ser tu contacto de confianza.</h2><p>Carolina podrá ayudarte a verificar situaciones sospechosas cuando vos lo autorices.</p></div><button class="btn g" onclick="S.linked=true;go(\'privacy\')">ACEPTAR VINCULACIÓN</button><button class="btn o" onclick="S.linked=false;go(\'privacy\')">AHORA NO</button><p class="s c">🔒 Vos decidís qué información compartir. Tu familiar no podrá leer todas tus conversaciones ni controlar tu celular.</p>';
return '<h1>Conectate con alguien de confianza</h1><p>Podés elegir quién te ayudará cuando necesites verificar una situación sospechosa.</p><div class="card p"><p class="s">Código de vinculación</p><input id="cd" inputmode="numeric" maxlength="6" value="'+(S.prof=='family'&&S.gen?S.code:'482915')+'" aria-label="Código de seis números"></div><button class="btn" onclick="tryLink()">INGRESAR CÓDIGO</button><button class="back" onclick="S.linked=false;go(\'privacy\')">Ahora no, agregar contactos más adelante</button>'},
privacy:function(){var o=[['a','Analizar contenido que comparto','Podrás enviarnos un mensaje o enlace sospechoso para revisarlo.'],['s','Compartir alertas con contactos de confianza','Podrás pedir ayuda a tus familiares cuando lo necesites.'],['n','Recibir notificaciones preventivas','Te avisaremos cuando haya información de seguridad importante.']];return '<h1>Tu privacidad es importante</h1><p>ESCUDO 360 te ayuda a identificar posibles riesgos respetando tus decisiones.</p>'+o.map(function(x){return '<div class="card"><div class="sw"><div><h2 style="font-size:1em">'+x[1]+'</h2><p class="s" style="margin:2px 0">'+x[2]+'</p></div><button class="tg '+(S.perm[x[0]]?'on':'')+'" role="switch" aria-checked="'+S.perm[x[0]]+'" aria-label="'+x[1]+'" onclick="tg(\''+x[0]+'\')"></button></div><p class="s" style="margin:4px 0 0"><b>'+(S.perm[x[0]]?'Activado':'Desactivado')+'</b></p></div>'}).join('')+'<button class="btn" onclick="go(\'tutorial\')">GUARDAR Y CONTINUAR</button><p class="c s">Podés cambiar estas preferencias cuando quieras.</p>'},
tutorial:function(){return '<h1>Conocé cómo funciona ESCUDO 360</h1><div class="card p row"><span class="ic">🔍🛡️</span><div><h2>Detectá señales de riesgo</h2><p class="s" style="margin:0">ESCUDO 360 te ayuda a revisar mensajes y enlaces sospechosos.</p></div></div><div class="card p row"><span class="ic">✋</span><div><h2>Hacé una Pausa Segura</h2><p class="s" style="margin:0">Si encontramos señales de riesgo, te explicamos qué hacer.</p></div></div><div class="card p row"><span class="ic">👥</span><div><h2>Verificá con tu familia</h2><p class="s" style="margin:0">Podés consultar a una persona de confianza cuando tengas dudas.</p></div></div><button class="btn" onclick="S.hist=[\'home\'];go(\'msg\')">EMPEZAR DEMOSTRACIÓN</button><button class="btn o" onclick="home()">IR A MI INICIO</button>'},
home:function(){var p=S.plan||'ind';var pl=S.plan?pname():'Plan Individual';var pr=S.plan?price():'$15.900';var act=p=='fam'?'Incluido en tu plan. Función no operativa en esta demostración.':'Disponible en el Plan Familiar.';return '<div class="row" style="justify-content:space-between">'+LOGO(40)+'<span class="tag">Demostración</span></div><h1>Hola, Marta 👋</h1><p><b style="color:#1D856A">✓ Tu configuración está completa</b></p><div class="card p"><div class="row"><span class="ic">✋</span><h2>PAUSA SEGURA</h2></div><p class="s">Revisá un mensaje o enlace sospechoso.</p><button class="btn" onclick="go(\'msg\')">ANALIZAR</button></div><div class="card p"><div class="row"><span class="ic">👪</span><h2>VERIFICACIÓN FAMILIAR</h2></div><p class="s">Consultá a tus contactos de confianza.</p><button class="btn" onclick="go(\'family\')">VER CONTACTOS</button></div><div class="card"><div class="row"><span class="ic">🌐</span><h2>PROTECCIÓN ACTIVA</h2></div><p class="s">VPN y filtrado de sitios potencialmente fraudulentos.</p><p class="s"><b>'+act+'</b></p></div><div class="card"><h2>Mi plan de protección</h2><p><b>'+pl+'</b><br>'+(p=='ind'?'1 adulto mayor protegido.<br>Hasta 2 contactos de confianza.':'Hasta 2 adultos mayores protegidos.<br>Hasta 4 contactos de confianza.')+'</p><div class="price">'+pr+' <span class="s">mensuales</span></div><button class="btn" onclick="go(\'myplan\')">VER MI PLAN</button><button class="btn o" onclick="S.fromHome=true;go(\'plans\')">COMPARAR PLANES</button></div>'},
myplan:function(){var p=S.plan||'ind';return back()+'<h1>'+(p=='ind'?'Plan Individual':'Plan Familiar')+'</h1><div class="price">'+(p=='ind'?'$15.900':'$31.900')+' <span class="s">/ mes · IVA incluido</span></div><div class="card p">'+li(p=='ind'?IND:FAM)+'</div><button class="btn o" onclick="S.fromHome=true;go(\'plans\')">COMPARAR PLANES</button>'},
analyze:function(){return '<h1>Analizar</h1><p>Compartí con ESCUDO 360 un mensaje o enlace que te genere dudas.</p><div class="card p"><h2>📩 1 mensaje nuevo de un número desconocido</h2><button class="btn" onclick="go(\'msg\')">ABRIR MENSAJE</button></div><p class="s c">Solo se analiza lo que vos decidís compartir.</p>'},
family:function(){return '<h1>Familia</h1><p>Tus contactos de confianza.</p>'+(S.linked===false?'<div class="card p"><p>Todavía no vinculaste a nadie.</p><button class="btn" onclick="S.found=false;go(\'link\')">VINCULAR AHORA</button></div>':'<div class="card"><div class="row"><div class="av">CL</div><div><h2>Carolina López</h2><p class="s" style="margin:0">Hija · contacto de confianza autorizado</p></div></div></div>')+'<button class="btn o" onclick="toast(\'Función no operativa en esta demostración\')">AGREGAR CONTACTO</button>'},
settings:function(){return '<h1>Configuración</h1><div class="card"><h2>Tamaño de letra</h2><div class="row"><button class="btn o sm" onclick="fs(-.1)" aria-label="Reducir letra">A−</button><button class="btn o sm" onclick="fs(.1)" aria-label="Aumentar letra">A+</button><span class="s">'+Math.round(S.k*100)+'%</span></div></div><div class="card"><div class="sw"><h2>Alto contraste</h2><button class="tg '+(S.hc?'on':'')+'" role="switch" aria-checked="'+S.hc+'" aria-label="Alto contraste" onclick="S.hc=!S.hc;draw()"></button></div></div><div class="card"><h2>Privacidad</h2><button class="btn o" onclick="go(\'privacy\')">CAMBIAR AUTORIZACIONES</button></div><button class="btn" onclick="home()">VOLVER AL INICIO</button><button class="btn o" onclick="reset()">REINICIAR DEMOSTRACIÓN</button>'},
msg:function(){return back()+'<div class="wa"><div class="wah"><b>+54 9 11 5555-0142</b><br><span class="s">Número desconocido · no está en tus contactos</span></div><div class="bub">Hola ma, soy Juan. Se me rompió el celular y estoy usando este número. Necesito que me transfieras $150.000 urgente. Después te explico. Por favor, no llames porque estoy ocupado.<div class="s" style="text-align:right;color:#667">14:32</div></div></div><div class="card p"><p class="s">👀 Fijate: número desconocido · pedido urgente de dinero · dice ser un familiar</p></div><button class="btn" onclick="analyze()">ANALIZAR CON ESCUDO 360</button><p class="c s">Vos elegís compartir este mensaje. Simulación: no hay conexión con WhatsApp.</p>'},
scan:function(){return '<div class="c" style="padding-top:60px">'+LOGO(60)+'<div class="ic pulse" style="font-size:4em">🔍</div><h1>Estamos revisando el mensaje</h1><p>Buscamos señales que puedan indicar un intento de engaño.</p><div class="prog"><i id="pp" style="transition-duration:1.7s"></i></div></div>'},
alert:function(){return '<div class="warn"><div style="font-size:3.2em">⚠️</div><h1 style="color:#8a4d0a">ATENCIÓN: POSIBLE ESTAFA</h1><p>Este mensaje presenta señales de riesgo. Antes de enviar dinero, verificá quién te está escribiendo.</p></div><div class="sig"><span class="ic">📵</span><div><b>Número desconocido</b><p>El mensaje llega desde un número que no tenés registrado.</p></div></div><div class="sig"><span class="ic">⏱️</span><div><b>Pedido urgente</b><p>Te están solicitando dinero de manera inmediata.</p></div></div><div class="sig"><span class="ic">❓</span><div><b>Identidad sin confirmar</b><p>La persona dice ser un familiar, pero todavía no sabemos si realmente lo es.</p></div></div><button class="btn" onclick="go(\'verify\')">VERIFICAR CON MI FAMILIA</button><button class="btn o" onclick="go(\'safe\')">ENTENDIDO, NO VOY A TRANSFERIR</button>'},
safe:function(){return back()+'<div class="ok c"><div style="font-size:3em">🛡️</div><h1>Buena decisión</h1><p>Recomendamos verificar antes de enviar dinero. Llamá al número habitual de tu familiar o consultá a una persona de confianza.</p></div><button class="btn" onclick="go(\'verify\')">VERIFICAR CON MI FAMILIA</button><button class="btn o" onclick="home()">VOLVER AL INICIO</button>'},
verify:function(){var l=S.linked!==false;return back()+'<h1>Verificá antes de confiar</h1><p>Podés consultar a una persona de confianza para comprobar si este pedido es verdadero.</p>'+(l?'<div class="card p"><div class="row"><div class="av">CL</div><div><h2>Carolina López</h2><p class="s" style="margin:0">Hija<br>Contacto de confianza autorizado</p></div></div></div>'+(S.sent?'<div class="c"><div class="ic pulse">📨</div><p><b>Enviando consulta a Carolina…</b></p><div class="prog"><i style="width:100%;transition:width 1.7s"></i></div></div>':'<button class="btn" onclick="consult()">CONSULTAR A CAROLINA</button><p class="s c">Solo compartiremos la información necesaria para verificar esta situación.</p>'):'<div class="card p"><h2>Verificá por otro canal</h2><p>Llamá al número habitual de tu hijo, el que ya tenías guardado, o contactá directamente a una persona de confianza. No uses el número que te escribió.</p></div><button class="btn" onclick="go(\'reply\')">VERIFICAR POR OTRO CANAL</button>')},
reply:function(){return '<div class="wa"><div class="wah"><b>Carolina López</b> · Hija</div><div class="bub">Mamá, yo no te pedí dinero. Ese mensaje no es mío. No hagas la transferencia.</div></div><div class="ok"><h2 style="color:#1D856A">✓ Pedido no reconocido</h2><p>'+(S.linked!==false?'Tu contacto de confianza confirmó que no realizó esta solicitud de dinero.':'Al comunicarte por el número habitual comprobaste que tu familiar no pidió dinero.')+'</p></div><button class="btn g" onclick="go(\'final\')">VER RECOMENDACIÓN</button><p class="c s">Respuesta simulada para esta demostración.</p>'},
final:function(){return '<div class="c" style="padding-top:10px"><div style="font-size:4em">🛡️✅</div><h1>¡Bien hecho, Marta!</h1><p>Verificaste el mensaje antes de realizar una transferencia.</p><div class="card p"><p>Cuando alguien te pida dinero o información personal de manera urgente, comprobá su identidad mediante un canal de confianza.</p></div></div><button class="btn" onclick="home()">VOLVER AL INICIO</button><button class="btn o" onclick="S.hist=[\'home\'];S.cur=\'msg\';draw()">REPETIR DEMOSTRACIÓN</button><div style="margin-top:14px">'+BRAND(70)+'</div><p class="c s">ESCUDO 360 ayuda a reconocer señales de riesgo, pero no garantiza una protección absoluta.</p>'}
};
function draw(){var a=$('app');a.style.setProperty('--k',S.k);a.classList.toggle('hc',S.hc);var s=$('scr');s.style.animation='none';void s.offsetWidth;s.style.animation='';s.innerHTML=SC[S.cur]();s.scrollTop=0;$('nv').innerHTML=NAVS.indexOf(S.cur)>-1?nav():'';
var inp=$('cd');if(inp)inp.addEventListener('keydown',function(e){if(e.key=='Enter')tryLink()});
if(S.cur=='scan')setTimeout(function(){var p=$('pp');if(p)p.style.width='100%'},50)}
function fd(){var d=new Date();d.setDate(d.getDate()+14);return d.toLocaleDateString('es-AR',{day:'numeric',month:'long',year:'numeric'})}
function rw(a,b,g){return '<div class="rw"><span>'+a+'</span><b'+(g?' style="color:#1D856A"':'')+'>'+b+'</b></div>'}
var PM={mp:['💙','Mercado Pago','Pagás con tu cuenta'],cc:['💳','Tarjeta de crédito o débito','Visa, Mastercard y otras'],db:['🏦','Débito automático','Desde tu cuenta bancaria']};
function pm(k){S.pm=k;draw()}
function act(){if(!S.pm){toast('Elegí un medio de pago para continuar');return}S.trial=true;go('paid')}
SC.plans=function(){S.open=S.open||{};var card=function(p,nm,pr,who,hl,all,cls,tag){var o=S.open[p];return '<div class="card plan '+cls+(S.sel==p?' sel':'')+'" tabindex="0" onclick="sel(\''+p+'\')">'+(tag?'<span class="tag">'+tag+'</span>':'')+'<h2 style="font-size:1.2em;margin-top:6px">'+nm+'</h2><p class="s">'+who+'</p><div class="price">'+pr+' <span class="s">/ mes</span></div><p class="s"><i>IVA incluido · 14 días gratis</i></p>'+li(o?all:hl)+'<button class="back" onclick="event.stopPropagation();S.open[\''+p+'\']=!S.open[\''+p+'\'];draw()">'+(o?'Ver menos':'Ver todo lo que incluye')+'</button><button class="btn" onclick="event.stopPropagation();choose(\''+p+'\')">ELEGIR '+nm+'</button></div>'};return back()+'<h1>Elegí tu plan</h1><div class="trial">🎁 <b>14 días gratis</b> en los dos planes. Hoy no pagás nada.</div>'+card('ind','PLAN INDIVIDUAL','$15.900','Para proteger a 1 adulto mayor.',['Protege a 1 adulto mayor','Hasta 2 contactos de confianza','Pausa Segura y Verificación Familiar','Análisis de mensajes, enlaces y QR'],IND,'','')+card('fam','PLAN FAMILIAR','$31.900','Para proteger a hasta 2 adultos mayores.',['Protege hasta 2 adultos mayores','Hasta 4 contactos de confianza','Todo lo del Plan Individual','<b>Protección Activa:</b> VPN y filtrado de sitios'],FAM,'p','PROTECCIÓN AMPLIADA')};
SC.confirm=function(){return back()+'<h1>Tu prueba gratuita</h1><p>Revisá cómo funciona antes de seguir.</p><div class="card p"><h2>'+pname()+'</h2>'+rw('Prueba gratuita','14 días',1)+rw('Hoy pagás','$0',1)+rw('Después de la prueba',price()+' / mes')+rw('Primer cobro',fd())+'</div><div class="ok"><p class="s" style="margin:0"><b>Podés cancelar cuando quieras</b> durante los 14 días y no se te cobra nada.</p></div><button class="btn" onclick="go(\'pay\')">ELEGIR MEDIO DE PAGO</button><button class="btn o" onclick="bk()">CAMBIAR DE PLAN</button><p class="c s">Contratación simulada.</p>'};
SC.pay=function(){return back()+'<h1>Medio de pago</h1><p>Elegí cómo pagarías cuando termine la prueba gratuita.</p>'+Object.keys(PM).map(function(k){var x=PM[k];return '<div class="card opt '+(S.pm==k?'sel':'')+'" tabindex="0" role="radio" aria-checked="'+(S.pm==k)+'" onclick="pm(\''+k+'\')"><div class="big">'+x[0]+'</div><div><h2 style="font-size:1em">'+x[1]+'</h2><p class="s" style="margin:0">'+x[2]+'</p></div><span class="rd"></span></div>'}).join('')+'<div class="card p">'+rw('Hoy pagás','$0',1)+rw('Primer cobro ('+fd()+')',price())+'</div><button class="btn g" onclick="act()">ACTIVAR PRUEBA GRATIS</button><p class="c s">🔒 Simulación: no pedimos datos de tarjeta ni se realiza ningún cobro.</p>'};
SC.paid=function(){return '<div class="c" style="padding-top:14px"><div style="font-size:3.6em">🎉</div><h1>¡Prueba gratis activada!</h1><p>Tenés 14 días para conocer ESCUDO 360.</p></div><div class="ok">'+rw('Plan',pname())+rw('Medio de pago',PM[S.pm||'mp'][1])+rw('Hoy se cobró','$0',1)+rw('Primer cobro',fd()+' · '+price())+'</div><button class="btn" onclick="go(\''+(S.prof=='family'?'invite':'store')+'\')">COMENZAR CONFIGURACIÓN</button><p class="c s">Próximo paso: '+(S.prof=='family'?'invitar a quien querés proteger.':'instalar y configurar la aplicación.')+'</p>'};
function stp(id){var g=['plans','confirm','pay','paid'],c=S.prof=='family'?['invite','store','link','privacy','tutorial']:['store','link','privacy','tutorial'];var a=g.indexOf(id),l,n,t;if(a>-1){l='Contratación';n=a+1;t=4}else{a=c.indexOf(id);if(a<0)return '';l='Configuración';n=a+1;t=c.length}return '<div class="stp"><div class="s"><b>'+l+'</b> · paso '+n+' de '+t+'</div><div class="bar"><i style="width:'+(n/t*100)+'%"></i></div></div>'}
['plans','confirm','pay','paid','invite','store','link','privacy','tutorial'].forEach(function(id){var f=SC[id];SC[id]=function(){return stp(id)+f()}});
var oh=SC.home;SC.home=function(){var t='<div class="trial">🎁 <b>Prueba gratuita activa:</b> te quedan 14 días. Primer cobro el '+fd()+'.</div>';return oh().replace('Tu configuración está completa</b></p>','Tu configuración está completa</b></p>'+(S.trial?t:''))};
function fit(){var p=document.querySelector(".phone"),k=Math.min(1,innerWidth/430,innerHeight/884);p.style.transform="translate(-50%,-50%) scale("+k+")"}
addEventListener("resize",fit);fit();
draw();
</script>
</body>
</html>
